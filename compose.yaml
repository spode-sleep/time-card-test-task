services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-time_card}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-time_card_local}
      POSTGRES_DB: ${POSTGRES_DB:-time_card}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      target: development
    command: npm run dev --workspace @time-card/backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-time_card}:${POSTGRES_PASSWORD:-time_card_local}@database:5432/${POSTGRES_DB:-time_card}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      target: development
    command: npm run dev --workspace @time-card/frontend -- --host 0.0.0.0
    environment:
      FRONTEND_PORT: 5173
      BACKEND_URL: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
